services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finstrat}
      POSTGRES_USER: ${POSTGRES_USER:-finstrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finstrat} -d ${POSTGRES_DB:-finstrat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-finstrat};Username=${POSTGRES_USER:-finstrat};Password=${POSTGRES_PASSWORD}
      CoinmateController__BaseUrl: ${COINMATE_CONTROLLER_URL:-http://coinmate-controller:8080/}
      CoinmateController__ApiToken: ${CONTROLLER_API_TOKEN:-}
    volumes:
      - data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - coinmate-controller

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-9200}:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  data_protection_keys:

networks:
  coinmate-controller:
    external: true
